name = "oliworx-arcade-chat"
main = "cloudflare/arcade-chat.js"
compatibility_date = "2026-10-31"
workers_dev = false

[ai]
binding = "AI"

[[ratelimits]]
name = "CHAT_LIMITER"
namespace_id = "2026103101"

[ratelimits.simple]
limit = 8
period = 60

[[routes]]
pattern = "oliworx.dev/api/*"
zone_name = "oliworx.dev"
